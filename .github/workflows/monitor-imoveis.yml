name: Monitor Imoveis SQS 308

on:
  schedule:
    # A cada hora. Horarios do cron sao UTC e o GitHub pode atrasar
    # execucoes agendadas em periodos de pico.
    - cron: '0 * * * *'
  workflow_dispatch:

# Evita duas execucoes simultaneas gravando o CSV ao mesmo tempo.
concurrency:
  group: monitor-imoveis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --quiet requests beautifulsoup4

      # Nao acessam a rede. Pegam regressao no parser antes de uma execucao
      # real gravar dados errados no historico.
      - name: Rodar testes
        run: python -m unittest discover -p 'test_*.py' -v

      - name: Executar monitor
        env:
          GMAIL_USER: ${{ vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
        run: python monitor.py

      - name: Commitar historico
        run: |
          if [ -z "$(git status --porcelain imoveis_historico.csv)" ]; then
            echo "Sem alteracoes no historico."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imoveis_historico.csv
          git commit -m "Monitor: novos imoveis em $(date '+%Y-%m-%d %H:%M')"
          # Sobrevive a um push que tenha acontecido depois do checkout.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
