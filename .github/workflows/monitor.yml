name: Monitor SQS-308

on:
  schedule:
    - cron: '0 * * * *'  # toda hora
  workflow_dispatch:      # disparo manual para teste
  push:
    branches: ['fix/**']  # valida correcoes em modo seguro (DRY_RUN)

jobs:
  monitorar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias Python
        run: pip install playwright beautifulsoup4 requests -q

      - name: Instalar Chromium
        run: playwright install chromium --with-deps

      - name: Executar monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          # Fora da main: nao envia email, nao grava CSV e imprime o diagnostico.
          DRY_RUN: ${{ github.ref_name != 'main' && '1' || '' }}
          DEBUG_CARDS: ${{ github.ref_name != 'main' && '1' || '' }}
        run: python monitor.py
